{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Delete Post" %} - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">{% trans "Confirm Delete" %}</h5>
                </div>
                <div class="card-body">
                    <p>{% trans "Are you sure you want to delete this post?" %}</p>
                    <p class="fw-bold">"{{ object.title }}"</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">{% trans "Yes, Delete" %}</button>
                        <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
